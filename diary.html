<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Diary</title>

<style>
body{
    font-family: "Trebuchet MS", sans-serif;
    background: radial-gradient(circle at top,
      #1a0b2e,
      #120a24 60%,
      #070510);
    color:#f2e9ff;
    margin:0;
    padding:40px 20px;
}

nav{
    text-align:center;
    margin-bottom:40px;
}

nav a{
    color:#e7d4ff;
    text-decoration:none;
    margin:0 15px;
}

.container{
    max-width:800px;
    margin:auto;
    background:rgba(120,60,160,0.12);
    border:1px solid rgba(190,140,255,0.18);
    border-radius:20px;
    padding:30px;
    backdrop-filter:blur(10px);
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    min-height:200px;
    border:none;
    border-radius:15px;
    padding:15px;
    margin-top:20px;
    font-family:inherit;
    font-size:16px;
    box-sizing:border-box;
}

button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#c7a6ff;
    color:#120a24;
    font-weight:bold;
}
    .entry button{
    margin-top:10px;
    padding:8px 14px;
    font-size:14px;
}
.entry{
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,0.06);
}

.date{
    opacity:0.6;
    font-size:0.85em;
}
    #calendar{
    display:grid;
    grid-template-columns:
      repeat(auto-fill,minmax(100px,1fr));

    gap:10px;
    margin-top:25px;
    margin-bottom:25px;
}

.calendar-day{
    background:rgba(255,255,255,0.08);
    border-radius:12px;
    padding:10px;
    text-align:center;
    cursor:pointer;
}

    .calendar-day:hover{
    transform:scale(1.03);
    box-shadow:0 0 12px rgba(199,166,255,0.5);
}
</style>
</head>

<body>

<nav>
    <a href="index.html">🏠 Home</a>
    <a href="photos.html">📸 Photos</a>
    <a href="oracle.html">🌙 Ask Zula</a>
    <a href="vault.html">🔒 Vault</a>
</nav>

<div class="container">

    <h1>📖 Digital Diary</h1>

    <p>
        A place for thoughts, plans, victories, chaos,
        and whatever else wants to live here.
    </p>

    <textarea
      id="diaryInput"
      placeholder="Write today's entry..."
    ></textarea>

    <button onclick="saveEntry()">
        Save Entry 🌙
    </button>

    <h2>📅 Entry Calendar</h2>
    <div id="calendar"></div>
    <div id="entries"></div>

</div>

<script>

function saveEntry(){

    const input =
      document.getElementById("diaryInput");

    const text = input.value.trim();

    if(!text) return;

    const entries =
      JSON.parse(localStorage.getItem("diaryEntries")) || [];

    entries.unshift({
        date: new Date().toLocaleString(),
        text: text
    });

    localStorage.setItem(
        "diaryEntries",
        JSON.stringify(entries)
    );

    input.value = "";

    loadEntries();
    buildCalendar();
}
    function editEntry(index){

    const entries =
      JSON.parse(localStorage.getItem("diaryEntries")) || [];

    const updatedText = prompt(
        "Edit your entry:",
        entries[index].text
    );

    if(updatedText === null) return;

    entries[index].text = updatedText;

    localStorage.setItem(
        "diaryEntries",
        JSON.stringify(entries)
    );

    loadEntries();
    buildCalendar();
}

function loadEntries(){

    const container =
      document.getElementById("entries");

    const entries =
      JSON.parse(localStorage.getItem("diaryEntries")) || [];

    container.innerHTML = "";

  entries.forEach((entry,index) => {
    container.innerHTML += `
        <div class="entry">

            <div class="date">
                ${entry.date}
            </div>

            <br>

            <div class="entry-text">
                ${entry.text.replace(/\n/g,"<br>")}
            </div>

            <button onclick="editEntry(${index})">
                ✏️ Edit
            </button>

        </div>
    `;
 });
    
}
/* 🌙 THIS is the magic line */

function buildCalendar(){

    
    const calendar =
      document.getElementById("calendar");

    const entries =
      JSON.parse(localStorage.getItem("diaryEntries")) || [];

    calendar.innerHTML = "";

    entries.forEach((entry,index)=>{

        const date =
          new Date(entry.date);

        const day =
          date.toLocaleDateString();

        calendar.innerHTML += `
            <div
              class="calendar-day"
              onclick="jumpToEntry(${index})">

              📖<br>
              ${day}

            </div>
        `;
    });
}
 function jumpToEntry(index){

    const cards =
      document.querySelectorAll(".entry");

    if(cards[index]){
        cards[index].scrollIntoView({
            behavior:"smooth"
        });
    }
}
    window.onload = () => {
    loadEntries();
    buildCalendar();
};
</script>

</body>
</html>
